<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>吊車請款管理工具</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

:root{
  --pink:#C9938A; --soft-pink:#E8C4BC; --light-pink:#F5E6E3;
  --blue:#7A9BAD; --soft-blue:#B8CFDA; --light-blue:#E3EDF3;
  --sage:#9AAE9B; --light-sage:#E8F0E8;
  --cream:#FAF3EE; --bg:#FAFAF8; --dark:#37352F; --medium:#5A5248; --gray:#9B9A97;

  --radius-lg:18px; --radius:14px; --radius-sm:10px;
  --shadow-sm:0 1px 3px rgba(55,53,47,0.06);
  --shadow:0 4px 14px rgba(55,53,47,0.08);
  --shadow-lg:0 10px 30px rgba(55,53,47,0.12);
  --border:1px solid rgba(55,53,47,0.09);
  --topbar-h:56px; --bottomnav-h:64px; --sidebar-w:236px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--dark);
  font-family:'Noto Sans TC', -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3{margin:0; font-weight:700; letter-spacing:0.02em;}
p{margin:0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--soft-pink); color:var(--dark);}

/* ---------- Layout shell ---------- */
.app-shell{display:flex; min-height:100vh;}

.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--cream);
  border-right:var(--border);
  display:flex;
  flex-direction:column;
  padding:26px 16px;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{display:flex; align-items:center; gap:10px; padding:4px 10px 28px 10px;}
.brand-mark{
  width:38px; height:38px; border-radius:11px;
  background:linear-gradient(135deg, var(--pink), var(--blue));
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  box-shadow:var(--shadow-sm);
}
.brand-mark svg{width:20px; height:20px; stroke:#fff;}
.brand-text{line-height:1.25;}
.brand-text .t1{font-size:15px; font-weight:700; color:var(--dark);}
.brand-text .t2{font-size:11.5px; color:var(--gray); font-weight:500;}

.nav-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px;}
.nav-item{
  display:flex; align-items:center; gap:12px;
  padding:11px 14px; border-radius:var(--radius-sm);
  color:var(--medium); font-size:14.5px; font-weight:500;
  border-left:3px solid transparent;
  transition:background .15s ease, color .15s ease;
}
.nav-item svg{width:19px; height:19px; stroke:currentColor; flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,0.6);}
.nav-item.active{
  background:#fff; color:var(--pink); font-weight:700;
  border-left:3px solid var(--pink);
  box-shadow:var(--shadow-sm);
}
.sidebar-footer{margin-top:auto; padding:10px; font-size:11px; color:var(--gray); line-height:1.6;}

.topbar{
  display:none;
  position:fixed; top:0; left:0; right:0; height:var(--topbar-h);
  background:var(--cream); border-bottom:var(--border);
  align-items:center; gap:10px; padding:0 16px; z-index:40;
}
.topbar .brand-mark{width:30px; height:30px; border-radius:9px;}
.topbar .brand-mark svg{width:16px; height:16px;}
.topbar .brand-text .t1{font-size:14px;}
.topbar .brand-text .t2{display:none;}

.main-content{
  flex:1; min-width:0;
  padding:34px 40px 60px 40px;
  max-width:1180px;
}

.bottomnav{
  display:none;
  position:fixed; left:0; right:0; bottom:0; height:var(--bottomnav-h);
  background:#fff; border-top:var(--border);
  z-index:40;
  padding-bottom:env(safe-area-inset-bottom, 0);
}
.bottomnav-inner{display:flex; height:100%;}
.bn-item{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; color:var(--gray); font-size:10.5px; font-weight:500;
}
.bn-item svg{width:21px; height:21px; stroke:currentColor;}
.bn-item.active{color:var(--pink); font-weight:700;}

@media (max-width:899px){
  .sidebar{display:none;}
  .topbar{display:flex;}
  .bottomnav{display:block;}
  .main-content{padding:calc(var(--topbar-h) + 20px) 16px calc(var(--bottomnav-h) + 28px) 16px; max-width:100%;}
}

/* ---------- Page header ---------- */
.page-head{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:24px;}
.page-head h1{font-size:24px; color:var(--dark);}
.page-head .sub{font-size:13px; color:var(--gray); margin-top:5px; font-weight:500;}

.btn{
  display:inline-flex; align-items:center; gap:7px;
  border:none; border-radius:var(--radius-sm);
  padding:10px 18px; font-size:14px; font-weight:700;
  transition:transform .1s ease, box-shadow .15s ease, opacity .15s ease;
}
.btn svg{width:16px; height:16px; stroke:currentColor;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--pink); color:#fff; box-shadow:0 3px 10px rgba(201,147,138,0.35);}
.btn-primary:hover{opacity:0.92;}
.btn-secondary{background:#fff; color:var(--medium); border:var(--border);}
.btn-secondary:hover{background:var(--light-pink);}
.btn-ghost{background:transparent; color:var(--medium);}
.btn-ghost:hover{background:rgba(55,53,47,0.05);}
.btn-danger{background:#fff; color:#B4574C; border:1px solid rgba(180,87,76,0.35);}
.btn-danger:hover{background:#FBEDEB;}
.btn-block{width:100%; justify-content:center;}
.btn-sm{padding:7px 12px; font-size:12.5px;}

/* ---------- Cards ---------- */
.card{
  background:#fff; border-radius:var(--radius-lg); border:var(--border);
  box-shadow:var(--shadow-sm); padding:20px;
}

.stat-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; margin-bottom:28px;}
@media (max-width:1050px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:520px){.stat-grid{grid-template-columns:1fr 1fr; gap:10px;}}

.stat-card{
  background:#fff; border-radius:var(--radius-lg); border:var(--border);
  box-shadow:var(--shadow-sm); padding:18px 20px; position:relative; overflow:hidden;
}
.stat-card::before{content:""; position:absolute; top:0; left:0; right:0; height:3px;}
.stat-card.c-pink::before{background:var(--pink);}
.stat-card.c-blue::before{background:var(--blue);}
.stat-card.c-sage::before{background:var(--sage);}
.stat-card.c-dark::before{background:var(--medium);}
.stat-card .icon-badge{
  width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; margin-bottom:12px;
}
.stat-card.c-pink .icon-badge{background:var(--light-pink); color:var(--pink);}
.stat-card.c-blue .icon-badge{background:var(--light-blue); color:var(--blue);}
.stat-card.c-sage .icon-badge{background:var(--light-sage); color:var(--sage);}
.stat-card.c-dark .icon-badge{background:var(--light-pink); color:var(--medium);}
.stat-card .icon-badge svg{width:18px; height:18px; stroke:currentColor;}
.stat-card .label{font-size:12.5px; color:var(--gray); font-weight:500; margin-bottom:4px;}
.stat-card .value{font-size:23px; font-weight:900; color:var(--dark); letter-spacing:0.01em;}

.section-title{display:flex; align-items:center; justify-content:space-between; margin:34px 0 14px 0;}
.section-title h2{font-size:16.5px; color:var(--dark);}
.section-title .sub{font-size:12px; color:var(--gray); font-weight:500;}

/* ---------- Filter bar ---------- */
.filter-bar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
.input, select.input, .input-search input{
  border:var(--border); border-radius:var(--radius-sm); background:#fff;
  padding:10px 13px; font-size:14px; color:var(--dark); outline:none;
}
.input:focus, select.input:focus, .input-search input:focus{border-color:var(--soft-pink); box-shadow:0 0 0 3px var(--light-pink);}
.input-search{position:relative; flex:1; min-width:180px;}
.input-search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:15px; height:15px; stroke:var(--gray);}
.input-search input{width:100%; padding-left:34px;}
select.input{min-width:120px;}

/* ---------- Order list ---------- */
.order-list{display:flex; flex-direction:column; gap:10px;}
.order-row{
  display:grid; grid-template-columns:1.3fr 1fr 1.3fr 0.8fr 0.7fr 1fr auto;
  gap:12px; align-items:center;
  background:#fff; border:var(--border); border-radius:var(--radius); padding:14px 16px;
  box-shadow:var(--shadow-sm); cursor:pointer; transition:box-shadow .15s ease, border-color .15s ease;
}
.order-row:hover{box-shadow:var(--shadow); border-color:var(--soft-pink);}
.order-row .cell{min-width:0;}
.order-row .cell .k{display:none; font-size:10.5px; color:var(--gray); font-weight:700; margin-bottom:2px;}
.order-row .client-name{font-weight:700; color:var(--dark); font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.order-row .client-sub{font-size:11.5px; color:var(--gray); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.order-row .amount{font-weight:900; color:var(--pink); font-size:15px; text-align:right;}
.order-row .row-actions{display:flex; gap:6px;}
.icon-btn{
  width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  background:var(--light-pink); color:var(--pink); border:none; flex-shrink:0;
}
.icon-btn.gray{background:rgba(55,53,47,0.06); color:var(--medium);}
.icon-btn svg{width:15px; height:15px; stroke:currentColor;}
.icon-btn:hover{opacity:0.8;}

@media (max-width:760px){
  .order-row{grid-template-columns:1fr 1fr; grid-auto-rows:auto; row-gap:10px;}
  .order-row .cell .k{display:block;}
  .order-row .row-actions{grid-column:1/-1; justify-content:flex-end; border-top:1px dashed rgba(55,53,47,0.1); padding-top:10px; margin-top:2px;}
  .order-row .amount{text-align:left;}
}

/* ---------- Client list ---------- */
.client-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px;}
.client-card{background:#fff; border:var(--border); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow-sm);}
.client-card .name{font-weight:700; font-size:15px; color:var(--dark); margin-bottom:6px;}
.client-card .row{font-size:12.5px; color:var(--medium); display:flex; gap:6px; margin-top:4px; line-height:1.5;}
.client-card .row .lab{color:var(--gray); flex-shrink:0; width:44px;}
.client-card .actions{display:flex; gap:8px; margin-top:12px;}

/* ---------- Stats table ---------- */
.stats-table{width:100%; border-collapse:collapse; background:#fff; border-radius:var(--radius); overflow:hidden; border:var(--border);}
.stats-table th, .stats-table td{padding:12px 14px; text-align:left; font-size:13.5px;}
.stats-table thead th{background:var(--light-pink); color:var(--medium); font-weight:700; font-size:12px;}
.stats-table tbody tr{border-top:1px solid rgba(55,53,47,0.06);}
.stats-table tbody tr:hover{background:var(--light-pink);}
.stats-table td.num{text-align:right; font-variant-numeric:tabular-nums;}
.stats-table tfoot td{font-weight:900; background:var(--light-blue); border-top:2px solid var(--soft-blue);}
.bar-cell{width:150px;}
.bar-track{height:8px; background:var(--light-blue); border-radius:99px; overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg, var(--pink), var(--blue)); border-radius:99px;}

.table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}

/* ---------- Empty state ---------- */
.empty-state{
  display:flex; flex-direction:column; align-items:center; text-align:center;
  padding:56px 20px; color:var(--gray);
  background:#fff; border:1px dashed rgba(55,53,47,0.16); border-radius:var(--radius-lg);
}
.empty-state .icon-badge{width:56px; height:56px; border-radius:16px; background:var(--light-pink); color:var(--pink); display:flex; align-items:center; justify-content:center; margin-bottom:16px;}
.empty-state .icon-badge svg{width:26px; height:26px; stroke:currentColor;}
.empty-state h3{font-size:15px; color:var(--dark); margin-bottom:6px;}
.empty-state p{font-size:13px; color:var(--gray); margin-bottom:18px; max-width:280px;}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(55,53,47,0.42); z-index:80;
  display:none; align-items:center; justify-content:center; padding:20px;
}
.modal-overlay.open{display:flex;}
.modal-panel{
  background:#fff; border-radius:var(--radius-lg); width:100%; max-width:560px;
  max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lg);
}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:20px 22px; border-bottom:var(--border); position:sticky; top:0; background:#fff; z-index:2;}
.modal-head h3{font-size:16.5px;}
.modal-body{padding:20px 22px;}
.modal-foot{display:flex; gap:10px; justify-content:flex-end; padding:16px 22px; border-top:var(--border); position:sticky; bottom:0; background:#fff;}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.form-grid .full{grid-column:1/-1;}
@media (max-width:520px){.form-grid{grid-template-columns:1fr;}}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--medium); margin-bottom:6px;}
.field .req{color:var(--pink);}
.field input, .field select, .field textarea{
  width:100%; border:var(--border); border-radius:var(--radius-sm); background:var(--bg);
  padding:10px 12px; font-size:14px; color:var(--dark); outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--soft-pink); box-shadow:0 0 0 3px var(--light-pink); background:#fff;}
.field textarea{resize:vertical; min-height:60px;}
.field-hint{font-size:11.5px; color:var(--sage); margin-top:5px; font-weight:500;}
.time-range-row{display:flex; align-items:center; gap:8px;}
.time-range-row input{flex:1; min-width:0;}
.time-sep{color:var(--gray); font-size:13px; flex-shrink:0;}
.duration-display{background:var(--light-sage); border:1px dashed var(--sage); border-radius:var(--radius-sm); padding:10px 12px; font-weight:700; color:var(--dark); font-size:15px;}
.checkbox-row{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--medium); margin-top:4px;}
.checkbox-row input{width:16px; height:16px;}

@media (max-width:600px){
  .modal-overlay{padding:0; align-items:flex-end;}
  .modal-panel{max-width:100%; max-height:94vh; border-radius:20px 20px 0 0;}
}

.divider-fade{height:3px; border-radius:99px; background:linear-gradient(90deg, var(--pink), var(--blue)); opacity:0.5; margin:6px 0 22px 0;}

.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--dark); color:#fff; padding:11px 20px; border-radius:99px;
  font-size:13.5px; font-weight:500; box-shadow:var(--shadow-lg); z-index:120;
  opacity:0; transition:opacity .25s ease, transform .25s ease; pointer-events:none;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
@media (max-width:899px){.toast{bottom:calc(var(--bottomnav-h) + 16px);}}

.recent-list{display:flex; flex-direction:column; gap:8px;}
.recent-item{display:flex; align-items:center; justify-content:space-between; background:#fff; border:var(--border); border-radius:var(--radius-sm); padding:12px 14px;}
.recent-item .l{font-size:13.5px; color:var(--dark); font-weight:700;}
.recent-item .l .sub{font-weight:500; color:var(--gray); font-size:12px; margin-top:2px;}
.recent-item .r{font-weight:900; color:var(--pink); font-size:14px;}

.backup-block{background:#fff; border:var(--border); border-radius:var(--radius-lg); padding:22px; margin-bottom:18px;}
.backup-block h3{font-size:14.5px; margin-bottom:6px;}
.backup-block p{font-size:12.5px; color:var(--gray); margin-bottom:14px; line-height:1.6;}
.backup-block.danger{border-color:rgba(180,87,76,0.3); background:#FDF7F6;}

/* ---------- Schedule page ---------- */
.crew-chip-row{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px 2px; margin-bottom:20px; -webkit-overflow-scrolling:touch;}
.chip{flex-shrink:0; padding:9px 18px; border-radius:999px; border:var(--border); background:#fff; color:var(--medium); font-size:13.5px; font-weight:700; white-space:nowrap;}
.chip.active{background:var(--pink); color:#fff; border-color:var(--pink); box-shadow:0 3px 10px rgba(201,147,138,0.35);}
.seg-toggle{display:inline-flex; border:var(--border); border-radius:999px; padding:3px; background:#fff;}
.seg-btn{border:none; background:transparent; padding:7px 16px; border-radius:999px; font-size:13px; font-weight:700; color:var(--medium);}
.seg-btn.active{background:var(--pink); color:#fff;}
.tag-list{display:flex; flex-wrap:wrap; gap:8px;}
.tag-chip{display:inline-flex; align-items:center; gap:6px; background:var(--light-blue); color:var(--blue); font-weight:700; font-size:13px; padding:7px 8px 7px 14px; border-radius:999px;}
.tag-chip button{display:flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%; border:none; background:rgba(255,255,255,0.6); color:var(--blue); flex-shrink:0;}
.tag-chip button svg{width:10px; height:10px; stroke:currentColor;}
.date-group-header{font-size:13px; font-weight:700; color:var(--pink); margin:22px 0 10px 0; padding-left:2px;}
.date-group-header:first-of-type{margin-top:2px;}
.job-card{background:#fff; border:var(--border); border-radius:var(--radius-lg); padding:18px 20px; margin-bottom:12px; box-shadow:var(--shadow-sm);}
.job-time-badge{display:inline-block; background:var(--light-blue); color:var(--blue); font-weight:700; font-size:12px; padding:4px 11px; border-radius:999px; margin-bottom:10px;}
.source-badge{display:inline-block; font-weight:700; font-size:12px; padding:4px 11px; border-radius:999px; margin-bottom:10px;}
.source-badge.own{background:var(--light-sage); color:var(--sage);}
.source-badge.external{background:var(--light-pink); color:var(--pink);}
.badge-toggle{display:block; margin-top:6px; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; border:none; cursor:pointer; white-space:nowrap;}
.badge-toggle.unsettled{background:var(--light-pink); color:#B4574C;}
.badge-toggle.settled{background:var(--light-sage); color:var(--sage);}
.badge-toggle-select{display:block; margin-top:6px; padding:3px 22px 3px 10px; border-radius:999px; font-size:11px; font-weight:700; border:none; cursor:pointer; white-space:nowrap; -webkit-appearance:none; appearance:none; background-repeat:no-repeat; background-position:right 7px center; background-size:9px; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235A5248' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");}
.badge-toggle-select.status-unbilled{background-color:rgba(155,154,151,0.16); color:var(--medium);}
.badge-toggle-select.status-billed{background-color:var(--light-pink); color:#B4574C;}
.badge-toggle-select.status-paid{background-color:var(--light-sage); color:var(--sage);}
.job-client{font-size:16px; font-weight:900; color:var(--dark); margin-bottom:8px;}
.job-row{display:flex; gap:8px; font-size:13.5px; color:var(--medium); margin-top:6px; line-height:1.5;}
.job-row .lab{color:var(--gray); flex-shrink:0; width:48px;}
.job-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}

/* ---------- In-page invoice view (avoids window.open, which is blocked in many mobile/in-app browsers) ---------- */
.invoice-view{display:none; position:fixed; inset:0; background:#fff; z-index:300; overflow-y:auto;}
.invoice-view.open{display:block;}
.invoice-toolbar{position:sticky; top:0; background:var(--cream); border-bottom:var(--border); padding:14px 20px; display:flex; justify-content:flex-end; gap:10px; z-index:2;}
.invoice-doc{max-width:800px; margin:0 auto; padding:32px 24px 60px 24px; color:#37352F;}
.invoice-doc h1{font-size:22px; text-align:center; letter-spacing:4px; margin-bottom:24px;}
.invoice-head-row{display:flex; justify-content:space-between; margin-bottom:20px; font-size:13px; line-height:1.8; flex-wrap:wrap; gap:16px;}
.invoice-head-row .box{min-width:240px; flex:1;}
.invoice-head-row .lab{color:#9B9A97; margin-right:6px;}
.invoice-doc table{width:100%; border-collapse:collapse; margin-top:10px; font-size:13px;}
.invoice-doc th, .invoice-doc td{border:1px solid #ddd; padding:8px 10px; text-align:left;}
.invoice-doc th{background:#F5E6E3; font-weight:700;}
.invoice-doc td.num, .invoice-doc th.num{text-align:right;}
.invoice-totals{margin-top:16px; width:320px; margin-left:auto; font-size:13.5px;}
.invoice-totals div{display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #eee;}
.invoice-totals .grand{font-weight:900; font-size:16px; border-bottom:none; border-top:2px solid #37352F; padding-top:10px; margin-top:6px;}

/* ---------- In-page envelope print view ---------- */

/* ============================================================
   FORMATTERS
============================================================ */
const currencyFmt = new Intl.NumberFormat('zh-TW', { style:'currency', currency:'TWD', maximumFractionDigits:0 });
function fmtMoney(n){ n = Number(n)||0; return currencyFmt.format(n); }
function fmtNum(n, d){ n = Number(n)||0; return n.toLocaleString('zh-TW', { maximumFractionDigits: d==null?1:d }); }
function fmtDate(s){ if(!s) return ''; const p = s.split('-'); return p.length===3 ? p[0]+'/'+p[1]+'/'+p[2] : s; }
function monthLabel(m){ if(!m) return ''; const p = m.split('-'); return p[0]+'年'+parseInt(p[1],10)+'月'; }
function fmtTimeRange(o){
  const parts = [];
  if(o.amStart || o.amEnd) parts.push('上午 '+(o.amStart||'?')+'-'+(o.amEnd||'?'));
  if(o.pmStart || o.pmEnd) parts.push('下午 '+(o.pmStart||'?')+'-'+(o.pmEnd||'?'));
  return parts.length ? parts.join('、') : '—';
}
function fmtVehicleSource(o){
  if(o.vehicleSource === 'external') return '外調'+(o.externalVendor?'：'+o.externalVendor:'');
  return '自家車';
}
function fmtCrewInfo(o){
  const parts = [];
  parts.push(fmtVehicleSource(o));
  if(o.vehicleNo) parts.push('車號 '+o.vehicleNo);
  if(o.driver) parts.push('司機 '+o.driver);
  if(o.assistant) parts.push('助手 '+o.assistant);
  return parts.join('・');
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function paymentStatusOf(o){ return (o && o.paymentStatus) || 'unbilled'; }
function paymentStatusLabel(status){
  if(status==='unbilled') return '未請款';
  if(status==='billed') return '已請款未收';
  if(status==='paid') return '已收款';
  return status;
}
function paymentStatusClass(status){
  if(status==='paid') return 'status-paid';
  if(status==='billed') return 'status-billed';
  return 'status-unbilled';
}
function taxTypeLabel(taxType){
  if(taxType==='added') return '稅外加';
  if(taxType==='exempt') return '免稅';
  return '稅內含';
}

/* ============================================================
   DERIVED DATA HELPERS
============================================================ */
function findClientByName(name){
  if(!name) return null;
  const n = name.trim();
  return activeClients().find(c => c.name.trim() === n) || null;
}
function isPeerClient(name){
  const c = findClientByName(name);
  return !!(c && c.type === 'peer');
}

function ordersInMonth(m){
  if(m === 'all') return activeOrders();
  return activeOrders().filter(o => (o.date||'').slice(0,7) === m);
}

function expensesInMonth(m){
  if(m === 'all') return state.expenses.slice();
  return state.expenses.filter(x => (x.date||'').slice(0,7) === m);
}

function distinctMonths(){
  const set = new Set(activeOrders().map(o => (o.date||'').slice(0,7)).filter(Boolean));
  state.expenses.forEach(x => { if(x.date) set.add(x.date.slice(0,7)); });
  return Array.from(set).sort().reverse();
}

function suggestAmount(clientName, tonnage, excludeId){
  const name = (clientName||'').trim();
  if(!name) return null;
  const candidates = activeOrders().filter(o => o.id !== excludeId && (o.clientName||'').trim() === name)
    .sort((a,b) => (b.date||'').localeCompare(a.date||''));
  if(!candidates.length) return null;
  if(tonnage !== '' && tonnage != null){
    const exact = candidates.filter(o => String(o.tonnage) === String(tonnage));
    if(exact.length) return { amount: exact[0].amount, exact:true };
  }
  return { amount: candidates[0].amount, exact:false };
}

function upsertClientFromOrder(name, taxId, address, phone){
  name = (name||'').trim();
  if(!name) return;
  let c = findClientByName(name);
  if(c){
    if(taxId && !c.taxId) c.taxId = taxId;
    if(address && !c.address) c.address = address;
    if(phone && !c.phone) c.phone = phone;
  } else {
    state.clients.push({ id: uid(), name, taxId: taxId||'', address: address||'', phone: phone||'', type:'client', note:'', createdAt: Date.now() });
  }
  saveClients();
}

  else if(state.page === 'orders') main.innerHTML = renderOrdersPage();
  else if(state.page === 'schedule') main.innerHTML = renderSchedulePage();
  else if(state.page === 'clients') main.innerHTML = renderClientsPage();
  else if(state.page === 'pricing') main.innerHTML = renderPricingPage();
  else if(state.page === 'expenses') main.innerHTML = renderExpensesPage();
  else if(state.page === 'stats') main.innerHTML = renderStatsPage();
  else if(state.page === 'receivables') main.innerHTML = renderReceivablesPage();
  else if(state.page === 'backup') main.innerHTML = renderBackupPage();
}

function rerenderPreservingFocus(){
  const active = document.activeElement;
  const id = active && active.id;
  const selStart = (active && typeof active.selectionStart === 'number') ? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd === 'number') ? active.selectionEnd : null;
  render();
  if(id){
    const el = document.getElementById(id);
    if(el){
      el.focus();
      if(selStart!=null){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

/* ============================================================
   DASHBOARD
============================================================ */
function renderDashboard(){
  const m = currentMonthStr();
  const monthOrders = ordersInMonth(m);
  const totalAmount = monthOrders.reduce((s,o)=>s+Number(o.amount||0),0);
  const totalHours = monthOrders.reduce((s,o)=>s+Number(o.duration||0),0);
  const clientSet = new Set(monthOrders.map(o=>o.clientName.trim()));

  const byClient = {};
  monthOrders.forEach(o=>{
    const k = o.clientName.trim();
    if(!byClient[k]) byClient[k] = { name:k, count:0, amount:0 };
    byClient[k].count++;
    byClient[k].amount += Number(o.amount||0);
  });
  const clientRows = Object.values(byClient).sort((a,b)=>b.amount-a.amount);
  const maxAmount = clientRows.length ? clientRows[0].amount : 0;

  const recent = state.orders.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0)).slice(0,5);

  let html = '';
  html += '<div class="page-head"><div><h1>儀表板</h1><div class="sub">'+monthLabel(m)+'・本月營運總覽</div></div>';
  html += '<button class="btn btn-primary" data-action="open-order-modal">'+ICONS.plus+'新增訂單</button></div>';

  html += '<div class="stat-grid">';
  html += statCard('c-pink', ICONS.money, '本月營收', fmtMoney(totalAmount));
  html += statCard('c-blue', ICONS.orders, '本月訂單數', fmtNum(monthOrders.length,0)+' 筆');
  html += statCard('c-sage', ICONS.clock, '本月總工時', fmtNum(totalHours)+' 小時');
  html += statCard('c-dark', ICONS.building, '服務客戶數', fmtNum(clientSet.size,0)+' 家');
  html += '</div>';

  html += '<div class="section-title"><h2>本月各客戶營業額</h2><span class="sub">依金額排序</span></div>';
  if(!clientRows.length){

function allCrewNames(){

  state.orders.forEach(o=>{
    if(o.driver) set.add(o.driver.trim());
    if(o.assistant) set.add(o.assistant.trim());
  });
  return Array.from(set).filter(Boolean).sort((a,b)=>a.localeCompare(b,'zh-Hant'));
}
function toLocalDate(dateStr){
  const p = (dateStr||'').split('-').map(Number);
  return new Date(p[0]||1970, (p[1]||1)-1, p[2]||1);
}
function relativeDayLabel(dateStr){
  const target = toLocalDate(dateStr);
  const now = new Date();
  const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((target - t0) / 86400000);
  if(diff===0) return '今天';
  if(diff===1) return '明天';
  if(diff===2) return '後天';
  return '';
}
function fmtDateWithWeekday(dateStr){
  const names = ['日','一','二','三','四','五','六'];
  const d = toLocalDate(dateStr);
  return (d.getMonth()+1)+'/'+d.getDate()+'（週'+names[d.getDay()]+'）';
}
function firstStartMinutes(o){
  const a = timeToMinutes(o.amStart);
  if(a!=null) return a;
  const p = timeToMinutes(o.pmStart);
  if(p!=null) return p;
  return 99999;
}
function mapsUrl(location){
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(location);
}
function copyTextToClipboard(text, onDone){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(onDone).catch(()=>legacyCopy(text, onDone));
  } else {
    legacyCopy(text, onDone);
  }
}
function legacyCopy(text, onDone){
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    onDone && onDone();
  }catch(e){ alert('複製失敗，請手動選取文字複製。'); }
}
function buildJobShareText(o){
  const lines = [];
  const rel = relativeDayLabel(o.date);
  lines.push((rel ? rel+'・' : '') + fmtDateWithWeekday(o.date));
  lines.push('時段：'+fmtTimeRange(o));
  lines.push('客戶：'+o.clientName);
  if(o.location) lines.push('地點：'+o.location);
  lines.push('車輛來源：'+fmtVehicleSource(o));
  if(o.vehicleNo) lines.push('車號：'+o.vehicleNo);
  if(o.driver) lines.push('司機：'+o.driver);
  if(o.assistant) lines.push('助手：'+o.assistant);
  if(o.workContent) lines.push('工作內容：'+o.workContent);
  if(o.note) lines.push('備註：'+o.note);
  if(o.location) lines.push('地圖：'+mapsUrl(o.location));
  return lines.join('\n');
}

function saveDriverReportFromModal(){
  const id = document.getElementById('rpt_id').value;
  const idx = state.orders.findIndex(o=>o.id===id);
  if(idx<0) return;
  const o = state.orders[idx];

  o.amStart = document.getElementById('rpt_amStart').value;
  o.amEnd = document.getElementById('rpt_amEnd').value;
  o.pmStart = document.getElementById('rpt_pmStart').value;
  o.pmEnd = document.getElementById('rpt_pmEnd').value;
  o.driverNote = document.getElementById('rpt_driverNote').value.trim();

  const am = computeSessionHours(o.amStart, o.amEnd);
  const pm = computeSessionHours(o.pmStart, o.pmEnd);
  o.duration = (am.valid?am.hours:0) + (pm.valid?pm.hours:0);

  o.reportedAt = Date.now();

  saveOrders();
  closeModal();
  render();
  showToast('已送出回報，等會計確認');
}

function renderStatsPage(){
  const m = state.statsMonth;
  const groupBy_dim = state.statsGroupBy === 'location' ? 'location' : 'client';
  const list = ordersInMonth(m);
  const expenses = expensesInMonth(m);
  const totalAmount = list.reduce((s,o)=>s+Number(o.amount||0),0);
  const totalExpense = expenses.reduce((s,x)=>s+Number(x.amount||0),0);
  const totalHours = list.reduce((s,o)=>s+Number(o.duration||0),0);

  function groupBy(keyFn){
    const map = {};
    list.forEach(o=>{
      const k = keyFn(o);
      if(!map[k]) map[k] = { label:k, count:0, hours:0, amount:0 };
      map[k].count++;
      map[k].hours += Number(o.duration||0);
      map[k].amount += Number(o.amount||0);
    });
    return Object.values(map).sort((a,b)=>b.amount-a.amount);
  }
  function breakdownTable(rows, colLabel){
    if(!rows.length) return '<div class="table-scroll"><p style="color:var(--gray); font-size:13px; padding:10px 2px;">本月尚無資料</p></div>';
    const max = rows[0].amount;
    let t = '<div class="table-scroll"><table class="stats-table"><thead><tr><th>'+colLabel+'</th><th>筆數</th><th>總時長</th><th>總金額</th><th class="bar-cell">佔比</th></tr></thead><tbody>';
    rows.forEach(r=>{
      const pct = max ? Math.round((r.amount/max)*100) : 0;
      t += '<tr><td>'+escapeHtml(r.label)+'</td><td class="num">'+r.count+'</td>'
        + '<td class="num">'+fmtNum(r.hours)+' 小時</td><td class="num">'+fmtMoney(r.amount)+'</td>'
        + '<td class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div></td></tr>';
    });
    t += '</tbody></table></div>';
    return t;
  }
  function buildVehicleRows(){
    const map = {};
    list.forEach(o=>{
      const k = o.vehicleNo ? o.vehicleNo.trim() : '未填寫車號';
      if(!map[k]) map[k] = { label:k, count:0, hours:0, income:0, expense:0 };
      map[k].count++;
      map[k].hours += Number(o.duration||0);
      map[k].income += Number(o.amount||0);
    });
    expenses.forEach(x=>{
      const k = x.licensePlate ? x.licensePlate.trim() : '未填寫車牌';
      if(!map[k]) map[k] = { label:k, count:0, hours:0, income:0, expense:0 };
      map[k].expense += Number(x.amount||0);
    });
    return Object.values(map).map(r=>Object.assign({}, r, { net: r.income - r.expense })).sort((a,b)=>b.net-a.net);
  }
  function vehicleBreakdownTable(rows){
    if(!rows.length) return '<div class="table-scroll"><p style="color:var(--gray); font-size:13px; padding:10px 2px;">本月尚無資料</p></div>';
    const maxNet = Math.max.apply(null, rows.map(r=>r.net).concat([0]));
    let t = '<div class="table-scroll"><table class="stats-table"><thead><tr><th>車號</th><th>筆數</th><th>總時長</th><th>收入</th><th>支出</th><th>淨營業額</th><th class="bar-cell">佔比</th></tr></thead><tbody>';
    rows.forEach(r=>{
      const pct = maxNet>0 ? Math.max(0, Math.round((r.net/maxNet)*100)) : 0;
      t += '<tr><td>'+escapeHtml(r.label)+'</td><td class="num">'+r.count+'</td>'
        + '<td class="num">'+fmtNum(r.hours)+' 小時</td>'
        + '<td class="num">'+fmtMoney(r.income)+'</td>'
        + '<td class="num" style="color:#B4574C">'+(r.expense?'−'+fmtMoney(r.expense):fmtMoney(0))+'</td>'
        + '<td class="num" style="font-weight:900;'+(r.net<0?'color:#B4574C':'')+'">'+fmtMoney(r.net)+'</td>'
        + '<td class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div></td></tr>';
    });
    t += '</tbody></table></div>';
    return t;
  }

  const clientRows = groupBy(o => o.clientName.trim() || '未填寫客戶');
  function receivableKey(o){
    if(groupBy_dim === 'location') return o.location ? o.location.trim() : '未填寫工地';
    return o.clientName.trim() || '未填寫客戶';
  }
  const customerRows = groupBy(o => (!isPeerClient(o.clientName)) ? receivableKey(o) : null).filter(r=>r.label);
  const peerReceivableRows = groupBy(o => isPeerClient(o.clientName) ? receivableKey(o) : null).filter(r=>r.label);
  function buildPeerPayableRows(){
    const map = {};
    list.forEach(o=>{
      if(o.vehicleSource !== 'external' || !o.vendorCost || Number(o.vendorCost)<=0) return;
      const k = o.externalVendor ? o.externalVendor.trim() : '未填寫外調對象';
      if(!map[k]) map[k] = { label:k, count:0, hours:0, amount:0 };

      map[k].amount += Number(o.vendorCost||0);
    });
    return Object.values(map).sort((a,b)=>b.amount-a.amount);

  const peerPayableRows = buildPeerPayableRows();
  const customerTotal = customerRows.reduce((s,r)=>s+r.amount,0);
  const peerReceivableTotal = peerReceivableRows.reduce((s,r)=>s+r.amount,0);
  const peerPayableTotal = peerPayableRows.reduce((s,r)=>s+r.amount,0);
  const vehicleRows = buildVehicleRows();

  const vehicleCount = new Set(list.map(o=>o.vehicleNo).filter(Boolean)).size;

  let html = '';
  html += '<div class="page-head"><div><h1>月結統計 / 對帳單</h1><div class="sub">用於月底結算各客戶應收帳款</div></div>';
  html += '<div style="display:flex; gap:10px; flex-wrap:wrap;">'
    + '<button class="btn btn-primary" data-action="open-order-modal">'+ICONS.plus+'新增訂單</button>'
    + '<input type="month" class="input" id="statsMonthInput" value="'+m+'">'
    + '<button class="btn btn-secondary" data-action="open-invoice-modal">'+ICONS.download+'開立請款單</button>'
    + '<button class="btn btn-secondary" data-action="export-stats-csv">'+ICONS.download+'匯出 CSV</button>'
    + '</div></div>';

  html += '<div class="filter-bar" style="align-items:center;">';
  html += '<div class="seg-toggle"><button class="seg-btn'+(groupBy_dim==='client'?' active':'')+'" data-action="set-stats-groupby" data-value="client">依客戶</button>'
    + '<button class="seg-btn'+(groupBy_dim==='location'?' active':'')+'" data-action="set-stats-groupby" data-value="location">依工地</button></div>';
  html += '</div>';

  html += '<div class="stat-grid">';
  html += statCard('c-pink', ICONS.money, monthLabel(m)+' 總營收', fmtMoney(totalAmount));
  html += statCard('c-blue', ICONS.orders, '訂單筆數', fmtNum(list.length,0)+' 筆');
  html += statCard('c-sage', ICONS.building, '出勤車輛數', fmtNum(vehicleCount,0)+' 台');
  html += statCard('c-dark', ICONS.clock, '合計工時', fmtNum(totalHours)+' 小時');
  html += '</div>';

  html += '<div class="stat-grid" style="grid-template-columns:repeat(2,1fr); margin-bottom:12px;">';
  html += statCard('c-dark', ICONS.expense, monthLabel(m)+' 支出合計', fmtMoney(totalExpense));
  html += statCard('c-pink', ICONS.money, monthLabel(m)+' 淨營收（營收−支出）', fmtMoney(totalAmount-totalExpense));
  html += '</div>';

  html += '<div class="stat-grid" style="margin-bottom:28px;">';

  html += statCard('c-blue', ICONS.money, '同行要給我們（本月）', fmtMoney(peerReceivableTotal));
  html += statCard('c-dark', ICONS.expense, '我們要給同行（本月）', fmtMoney(peerPayableTotal));
  html += statCard('c-sage', ICONS.exchange, '本月淨額（應收－應付）', fmtMoney(customerTotal+peerReceivableTotal-peerPayableTotal));
  html += '</div>';

  if(!list.length && !expenses.length){
    html += emptyState(ICONS.stats, '這個月份還沒有訂單或支出資料', '選擇其他月份，或先到「訂單清單」新增資料。', false);
    return html;
  }

  html += '<div class="section-title"><h2>客戶應收明細</h2><span class="sub">'+monthLabel(m)+'・一般客戶欠我們的錢（'+(groupBy_dim==='location'?'依工地':'依客戶')+'）</span></div>';
  html += breakdownTable(customerRows, groupBy_dim==='location' ? '工地' : '客戶名稱');

  html += '<div class="section-title"><h2>同行應收明細</h2><span class="sub">同行請我們做的工作，對方欠我們的錢（'+(groupBy_dim==='location'?'依工地':'依客戶')+'）</span></div>';
  html += breakdownTable(peerReceivableRows, groupBy_dim==='location' ? '工地' : '同行名稱');

  html += '<div class="section-title"><h2>同行應付明細</h2><span class="sub">外調同行車輛時，我們欠對方的外調費用</span></div>';
  html += breakdownTable(peerPayableRows, '同行名稱');

  const peerReceivableByNameRows = groupBy(o => isPeerClient(o.clientName) ? (o.clientName.trim() || '未填寫同行') : null).filter(r=>r.label);

/* ============================================================
   RECEIVABLES & PAYABLES PAGE（應收應付）
============================================================ */
function buildPeerNetRows(receivableRows, payableRows){
  const recvMap = {};
  receivableRows.forEach(r=>{ const amt = r.total!=null ? r.total : r.amount; recvMap[r.label] = (recvMap[r.label]||0) + amt; });
  const payMap = {};
  payableRows.forEach(r=>{ const amt = r.total!=null ? r.total : r.amount; payMap[r.label] = (payMap[r.label]||0) + amt; });
  const names = Object.keys(recvMap).filter(n => payMap.hasOwnProperty(n));
  return names.map(name=>{
    const receivable = recvMap[name];
    const payable = payMap[name];
    const net = receivable - payable;
    return { label:name, receivable, payable, net, netAbs: Math.abs(net), weOwe: net<0 };
  }).sort((a,b)=>b.netAbs-a.netAbs);
}
function renderPeerNetTable(rows){
  if(!rows.length) return '';
  let t = '<div class="section-title"><h2>同行互抵</h2><span class="sub">同一個同行同時有應收與應付時，自動互抵算出淨額</span></div>';
  t += '<div class="table-scroll"><table class="stats-table"><thead><tr><th>同行名稱</th><th>應收（對方欠我們）</th><th>應付（我們欠對方）</th><th>互抵淨額</th><th>結果</th></tr></thead><tbody>';
  rows.forEach(r=>{
    const color = r.weOwe ? '#B4574C' : 'var(--sage)';
    const label = r.weOwe ? '我們應付給同行' : '同行應付給我們';
    t += '<tr><td>'+escapeHtml(r.label)+'</td><td class="num">'+fmtMoney(r.receivable)+'</td><td class="num">'+fmtMoney(r.payable)+'</td>'
      + '<td class="num" style="font-weight:900; color:'+color+'">'+fmtMoney(r.netAbs)+'</td>'
      + '<td style="font-weight:700; color:'+color+'">'+label+'</td></tr>';
  });
  t += '</tbody></table></div>';
  return t;
}

function buildLedgerGroups(){
  const showSettled = state.receivablesFilters.showSettled;

  const clientMap = {};
  const peerReceivableMap = {};
  activeOrders().forEach(o=>{
    if(!showSettled && paymentStatusOf(o) === 'paid') return;
    const name = o.clientName ? o.clientName.trim() : '未填寫客戶';
    const target = isPeerClient(o.clientName) ? peerReceivableMap : clientMap;
    if(!target[name]) target[name] = { label:name, total:0, items:[] };
    target[name].total += Number(o.amount||0);
    target[name].items.push(o);
  });

  const peerPayableMap = {};
  activeOrders().forEach(o=>{
    if(o.vehicleSource !== 'external') return;
    if(!o.vendorCost || Number(o.vendorCost)<=0) return;
    if(!showSettled && o.vendorSettled) return;
    const name = o.externalVendor ? o.externalVendor.trim() : '未填寫外調對象';
    if(!peerPayableMap[name]) peerPayableMap[name] = { label:name, total:0, items:[] };
    peerPayableMap[name].total += Number(o.vendorCost||0);
    peerPayableMap[name].items.push(o);
  });

  function toSortedArray(map, sortField){
    return Object.values(map).map(g=>{
      g.items.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      return g;
    }).sort((a,b)=>b.total-a.total);
  }

  return {
    clientRows: toSortedArray(clientMap),
    peerReceivableRows: toSortedArray(peerReceivableMap),
    peerPayableRows: toSortedArray(peerPayableMap)
  };
}

function renderReceivablesPage(){
  const showSettled = state.receivablesFilters.showSettled;
  const groups = buildLedgerGroups();

  const clientTotal = groups.clientRows.reduce((s,g)=>s+g.total,0);
  const peerReceivableTotal = groups.peerReceivableRows.reduce((s,g)=>s+g.total,0);
  const peerPayableTotal = groups.peerPayableRows.reduce((s,g)=>s+g.total,0);
  const netTotal = clientTotal + peerReceivableTotal - peerPayableTotal;

  let html = '';
  html += '<div class="page-head"><div><h1>應收應付</h1><div class="sub">客戶／同行欠我們的錢，以及我們欠同行的外調費用，未銷帳的項目會一直顯示到結清為止</div></div>';
  html += '<label class="checkbox-row" style="background:#fff; border:var(--border); border-radius:999px; padding:9px 16px;"><input type="checkbox" id="showSettledToggle"'+(showSettled?' checked':'')+'> 顯示已結清項目</label>';
  html += '</div>';

  html += '<div class="stat-grid">';
  html += statCard('c-pink', ICONS.money, '客戶應收合計', fmtMoney(clientTotal));
  html += statCard('c-blue', ICONS.money, '同行應收合計', fmtMoney(peerReceivableTotal));
  html += statCard('c-dark', ICONS.expense, '同行應付合計', fmtMoney(peerPayableTotal));
  html += statCard('c-sage', ICONS.exchange, '淨額（應收－應付）', fmtMoney(netTotal));
  html += '</div>';

  const peerNetRows = buildPeerNetRows(groups.peerReceivableRows, groups.peerPayableRows);
  html += renderPeerNetTable(peerNetRows);

  function renderLedgerSection(title, sub, rows, kind){
    let s = '<div class="section-title"><h2>'+title+'</h2><span class="sub">'+sub+'</span></div>';
    if(!rows.length){
      s += '<div class="table-scroll"><p style="color:var(--gray); font-size:13px; padding:10px 2px;">目前沒有'+(showSettled?'':'未結清的')+'項目</p></div>';
      return s;
    }
    rows.forEach(g=>{
      s += '<div class="card" style="margin-bottom:14px;">';
      s += '<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;">'
        + '<div style="font-weight:900; font-size:15px; color:var(--dark);">'+escapeHtml(g.label)+'</div>'
        + '<div style="font-weight:900; font-size:15px; color:var(--pink);">'+fmtMoney(g.total)+'</div></div>';
      g.items.forEach(o=>{
        const amt = kind==='payable' ? Number(o.vendorCost||0) : Number(o.amount||0);
        let statusHtml;
        if(kind==='payable'){
          const isSettled = o.vendorSettled;
          statusHtml = '<button class="badge-toggle '+(isSettled?'settled':'unsettled')+'" style="margin-top:0;" data-action="toggle-vendor-settled" data-id="'+o.id+'">'+(isSettled?'已結清':'標記結清')+'</button>';
        } else {
          statusHtml = '<select class="badge-toggle-select '+paymentStatusClass(o.paymentStatus)+'" style="margin-top:0;" data-action="set-payment-status" data-id="'+o.id+'">'
            + '<option value="unbilled"'+(paymentStatusOf(o)==='unbilled'?' selected':'')+'>未請款</option>'
            + '<option value="billed"'+(paymentStatusOf(o)==='billed'?' selected':'')+'>已請款未收</option>'
            + '<option value="paid"'+(paymentStatusOf(o)==='paid'?' selected':'')+'>已收款</option>'
            + '</select>';
        }
        s += '<div class="recent-item"><div class="l">'+fmtDate(o.date)+'・'+escapeHtml(o.location||o.clientName)+'<div class="sub">'+escapeHtml(fmtTimeRange(o))+'</div></div>'
          + '<div style="display:flex; align-items:center; gap:10px;"><span class="r">'+fmtMoney(amt)+'</span>'+statusHtml+'</div></div>';
      });
      s += '</div>';
    });
    return s;
  }

  html += renderLedgerSection('客戶應收款', '一般客戶欠我們的錢', groups.clientRows, 'receivable');
  html += renderLedgerSection('同行應收款', '同行請我們做的工作，對方欠我們的錢', groups.peerReceivableRows, 'receivable');
  html += renderLedgerSection('同行應付款', '外調同行車輛時，我們欠對方的外調費用', groups.peerPayableRows, 'payable');

  return html;
}

  } else {

function timeSelectHtml(id, currentValue){
  let opts = '<option value=""'+(!currentValue?' selected':'')+'>—</option>';
  for(let m=0; m<1440; m+=30){
    const h = String(Math.floor(m/60)).padStart(2,'0');
    const mm = String(m%60).padStart(2,'0');
    const t = h+':'+mm;
    opts += '<option value="'+t+'"'+(currentValue===t?' selected':'')+'>'+t+'</option>';
  }
  return '<select id="'+id+'">'+opts+'</select>';
}

/* ---- time-range -> duration helpers ---- */
function timeToMinutes(t){
  if(!t) return null;
  const parts = t.split(':');
  if(parts.length<2) return null;
  const h = Number(parts[0]), m = Number(parts[1]);
  if(isNaN(h)||isNaN(m)) return null;
  return h*60+m;
}
function computeSessionHours(start,end){
  const s = timeToMinutes(start), e = timeToMinutes(end);
  if(s==null || e==null) return { hours:0, valid:true };
  if(e<=s) return { hours:0, valid:false };
  return { hours:(e-s)/60, valid:true };
}
function recomputeDuration(){
  const am = computeSessionHours(document.getElementById('f_amStart').value, document.getElementById('f_amEnd').value);
  const pm = computeSessionHours(document.getElementById('f_pmStart').value, document.getElementById('f_pmEnd').value);
  const total = (am.valid?am.hours:0) + (pm.valid?pm.hours:0);
  document.getElementById('f_duration').value = total;
  document.getElementById('durationDisplay').textContent = fmtNum(total) + ' 小時';
  const warnMsgs = [];
  if(!am.valid) warnMsgs.push('上午迄時間需晚於起始時間');
  if(!pm.valid) warnMsgs.push('下午迄時間需晚於起始時間');
  document.getElementById('durationWarn').textContent = warnMsgs.join('；');
}
function initDurationDisplay(order){
  const hasNewFields = order && (order.amStart || order.amEnd || order.pmStart || order.pmEnd);
  if(hasNewFields){
    recomputeDuration();
  } else {
    const legacy = order && order.duration ? Number(order.duration) : 0;
    document.getElementById('f_duration').value = legacy;
    document.getElementById('durationDisplay').textContent = fmtNum(legacy) + ' 小時' + (order && legacy ? '（舊資料，輸入上／下午時段可重新自動計算）' : '');
  }
}

function findPricingRule(tonnage){
  if(tonnage === '' || tonnage == null) return null;
  return state.pricingRules.find(r => String(r.tonnage) === String(tonnage)) || null;
}
function findSpecialPricingRule(clientName, tonnage){
  if(!clientName || tonnage === '' || tonnage == null) return null;
  const name = clientName.trim();
  return state.specialPricing.find(r => (r.clientName||'').trim()===name && String(r.tonnage)===String(tonnage)) || null;
}
function findVendorRate(vendorName){
  if(!vendorName) return null;
  const name = vendorName.trim();
  return state.vendorRates.find(r => (r.vendorName||'').trim()===name) || null;
}
const DAILY_NORMAL_HOURS = 8;
const FIRST_HOUR_MINUTES = 60;
/* Splits worked time into: the flat-fee first hour (not returned, always charged separately),
   and the remaining "extra" time, itself split into extraNormalHours / extraOvertimeHours
   depending on whether each extra minute falls after the daily 8-hour mark or after the
   configured overtime clock-time window. The first 60 minutes of cumulative work are always
   excluded from this split — they're covered by the flat first-hour fee no matter when they fall. */
function splitBillableHours(amStart,amEnd,pmStart,pmEnd,startStr,endStr){
  const intervals = [];
  function addInterval(s,e){
    const sm=timeToMinutes(s), em=timeToMinutes(e);
    if(sm!=null && em!=null && em>sm) intervals.push([sm,em]);
  }
  addInterval(amStart,amEnd);
  addInterval(pmStart,pmEnd);
  if(!intervals.length) return { extraNormalHours:0, extraOvertimeHours:0 };
  intervals.sort((a,b)=>a[0]-b[0]);

  const dailyThresholdMin = DAILY_NORMAL_HOURS * 60; // rule 1: hours beyond 8/day are overtime
  const timeThreshold = timeToMinutes(startStr); // rule 2: clock time after this is overtime (optional)
  const endThreshold = timeToMinutes(endStr);
  // when endThreshold is at or before timeThreshold (e.g. 17:00 ~ 07:00), the overtime window
  // wraps past midnight, so a clock-minute counts as OT if it's after start OR before end
  const wrapsPastMidnight = timeThreshold!=null && endThreshold!=null && endThreshold <= timeThreshold;
  const timeUpperBound = endThreshold==null ? Infinity : endThreshold;

  let cumulative = 0; // minutes worked so far, before the current interval
  let extraNormalMinutes = 0;
  let extraOvertimeMinutes = 0;
  intervals.forEach(([s,e])=>{
    const len = e - s;
    for(let offset=0; offset<len; offset++){
      const cumIndex = cumulative + offset; // this minute's position among all minutes worked today
      if(cumIndex < FIRST_HOUR_MINUTES) continue; // part of the flat first-hour fee, not rate-classified
      const clockMinute = s + offset;
      const isDailyOT = cumIndex >= dailyThresholdMin;
      const isTimeOT = timeThreshold!=null && (wrapsPastMidnight
        ? (clockMinute >= timeThreshold || clockMinute < endThreshold)
        : (clockMinute >= timeThreshold && clockMinute < timeUpperBound));
      if(isDailyOT || isTimeOT) extraOvertimeMinutes++;
      else extraNormalMinutes++;
    }
    cumulative += len;
  });
  return { extraNormalHours: extraNormalMinutes/60, extraOvertimeHours: extraOvertimeMinutes/60 };
}
function calcPricingSuggestion(rule, totalHours){
  if(!rule || totalHours<=0) return null;
  const split = splitBillableHours(
    document.getElementById('f_amStart') ? document.getElementById('f_amStart').value : '',
    document.getElementById('f_amEnd') ? document.getElementById('f_amEnd').value : '',
    document.getElementById('f_pmStart') ? document.getElementById('f_pmStart').value : '',
    document.getElementById('f_pmEnd') ? document.getElementById('f_pmEnd').value : '',
    rule.overtimeStart, rule.overtimeEnd
  );
  const firstHourFee = Number(rule.firstHour||0); // always charged, regardless of when the first hour falls
  const tieredExtra = split.extraNormalHours * Number(rule.perHour||0);
  const rawBase = firstHourFee + tieredExtra;
  const cap = Number(rule.dailyCap||0);
  const cappedBase = cap>0 ? Math.min(rawBase, cap) : rawBase;
  const overtimeAmt = split.extraOvertimeHours * Number(rule.overtimeRate||0);
  const total = Math.round(cappedBase + overtimeAmt);
  return { total, tiered: cappedBase, overtimeAmt, overtimeHours: split.extraOvertimeHours, normalHours: 1 + split.extraNormalHours, hitCap: cap>0 && rawBase>cap };
}

function bindOrderModalEvents(excludeId, order){
  const nameEl = document.getElementById('f_clientName');
  const taxEl = document.getElementById('f_clientTaxId');
  const phoneEl = document.getElementById('f_clientPhone');
  const tonEl = document.getElementById('f_tonnage');
  const amtEl = document.getElementById('f_amount');
  const hintEl = document.getElementById('amountHint');
  const taxPreviewEl = document.getElementById('taxPreview');
  const recalcBtn = document.getElementById('recalcAmountBtn');
  let amountAutoFilled = false; // true only while the amount field holds a value WE filled in, not something the user typed

  function getTimes(){
    return {
      amStart: document.getElementById('f_amStart').value,
      amEnd: document.getElementById('f_amEnd').value,
      pmStart: document.getElementById('f_pmStart').value,
      pmEnd: document.getElementById('f_pmEnd').value
    };
  }

  function updateTaxPreview(){
    const amt = Number(amtEl.value) || 0;
    const taxType = document.getElementById('f_taxType').value;
    if(amt<=0){ taxPreviewEl.textContent = ''; return; }
    if(taxType === 'exempt'){
      taxPreviewEl.textContent = '免稅，不需計算稅額';
    } else if(taxType === 'added'){
      const tax = Math.round(amt * 0.05);
      const grand = amt + tax;
      taxPreviewEl.textContent = '稅額（+5%）：NT$'+fmtNum(tax,0)+'　含稅合計：NT$'+fmtNum(grand,0);
    } else {
      const taxIncluded = Math.round(amt - amt/1.05);
      taxPreviewEl.textContent = '此金額已內含稅額約：NT$'+fmtNum(taxIncluded,0);
    }
  }

  function calcAndFillAmount(force){
    if(!force && amtEl.value !== '' && !amountAutoFilled) { updateTaxPreview(); return; }
    const tonnage = tonEl.value;
    const totalHours = Number(document.getElementById('f_duration').value) || 0;
    const specialRule = findSpecialPricingRule(nameEl.value, tonnage);
    const rule = specialRule || findPricingRule(tonnage);

    if(rule && totalHours>0){
      const calc = calcPricingSuggestion(rule, totalHours);
      if(calc){
        amtEl.value = calc.total;
        amountAutoFilled = true;
        let msg = specialRule
          ? '💡 依【特殊客戶】'+escapeHtml(nameEl.value.trim())+' 專屬單價試算：'
          : '💡 依 '+fmtNum(rule.tonnage,1)+'噸單價試算：';
        msg += '基本 NT$'+fmtNum(calc.tiered,0)+'（正常工時 '+fmtNum(calc.normalHours)+' 小時'+(calc.hitCap?'，已達每日上限':'')+'）';
        if(calc.overtimeHours>0){
          msg += ' + 加班 '+fmtNum(calc.overtimeHours)+' 小時 NT$'+fmtNum(calc.overtimeAmt,0);
        }
        msg += ' ＝ NT$'+fmtNum(calc.total,0)+'，可自行修改';
        hintEl.textContent = msg;
        updateTaxPreview();
        return;
      }
    }
    // fallback: use history (same client + tonnage) when no pricing rule matches
    const s = suggestAmount(nameEl.value, tonnage, excludeId);
    if(s){
      amtEl.value = s.amount;
      amountAutoFilled = true;
      hintEl.textContent = s.exact ? '💡 已自動帶入該客戶、相同噸數的上次金額（NT$ '+fmtNum(s.amount,0)+'），可自行修改' : '💡 已帶入該客戶最近一筆金額作為參考（噸數不同），可自行修改';
    } else if(tonnage !== '' && tonnage != null){
      hintEl.textContent = '目前這個噸數尚未設定單價，也找不到歷史紀錄可參考。可以先到「單價設定」新增這個噸數的規則，或直接手動輸入金額。';
    } else {
      hintEl.textContent = '';
    }
    updateTaxPreview();
  }

  function applyClientAutofill(){
    const c = findClientByName(nameEl.value);
    if(c){
      if(!taxEl.value) taxEl.value = c.taxId||'';
      if(!phoneEl.value) phoneEl.value = c.phone||'';
    }
    calcAndFillAmount(false);
  }

  nameEl.addEventListener('change', applyClientAutofill);
  tonEl.addEventListener('change', ()=>calcAndFillAmount(false));
  tonEl.addEventListener('input', ()=>calcAndFillAmount(false));
  amtEl.addEventListener('input', ()=>{ amountAutoFilled = false; hintEl.textContent = ''; updateTaxPreview(); });
  document.getElementById('f_taxType').addEventListener('change', updateTaxPreview);
  recalcBtn.addEventListener('click', ()=>calcAndFillAmount(true));

  ['f_amStart','f_amEnd','f_pmStart','f_pmEnd'].forEach(id=>{
    document.getElementById(id).addEventListener('input', function(){
      recomputeDuration();
      calcAndFillAmount(false);
    });
  });

  const sourceEl = document.getElementById('f_vehicleSource');
  const vendorField = document.getElementById('externalVendorField');
  const vendorCostField = document.getElementById('vendorCostField');
  const vendorEl = document.getElementById('f_externalVendor');
  const vendorCostEl = document.getElementById('f_vendorCost');
  sourceEl.addEventListener('change', ()=>{
    const isExternal = sourceEl.value === 'external';
    vendorField.style.display = isExternal ? '' : 'none';
    vendorCostField.style.display = isExternal ? '' : 'none';
    if(!isExternal){
      vendorEl.value = '';
      vendorCostEl.value = '';
    }
  });
  vendorEl.addEventListener('change', ()=>{
    if(vendorCostEl.value !== '') return;
    const vr = findVendorRate(vendorEl.value);
    if(vr) vendorCostEl.value = vr.rate;
  });

  const confirmPendingEl = document.getElementById('f_confirmPending');
  if(confirmPendingEl){
    confirmPendingEl.addEventListener('change', function(){
      const section = document.getElementById('pendingAmountSection');
      section.style.display = confirmPendingEl.checked ? 'contents' : 'none';
      amtEl.required = confirmPendingEl.checked;
      if(confirmPendingEl.checked) calcAndFillAmount(false);
    });
  }

  updateTaxPreview();
  initDurationDisplay(order);
}

function saveOrderFromModal(){
  const confirmPendingEl = document.getElementById('f_confirmPending');
  if(confirmPendingEl && !confirmPendingEl.checked){
    showToast('請先核對司機回報的資料，並勾選確認後再填寫金額');
    return;
  }

  const form = document.getElementById('orderForm');
  if(!form.reportValidity()) return;

  const id = document.getElementById('f_id').value || uid();
  const isNew = !document.getElementById('f_id').value;
  const clientName = document.getElementById('f_clientName').value.trim();
  const clientTaxId = document.getElementById('f_clientTaxId').value.trim();
  const clientPhone = document.getElementById('f_clientPhone').value.trim();
  const date = document.getElementById('f_date').value;
  const docketNo = document.getElementById('f_docketNo').value.trim();
  const amStart = document.getElementById('f_amStart').value;
  const amEnd = document.getElementById('f_amEnd').value;
  const pmStart = document.getElementById('f_pmStart').value;
  const pmEnd = document.getElementById('f_pmEnd').value;
  const location = document.getElementById('f_location').value.trim();
  const duration = document.getElementById('f_duration').value;
  const workContent = document.getElementById('f_workContent').value.trim();
  const tonnage = document.getElementById('f_tonnage').value;
  const vehicleNo = document.getElementById('f_vehicleNo').value.trim();
  const driver = document.getElementById('f_driver').value.trim();
  const assistant = document.getElementById('f_assistant').value.trim();
  const vehicleSource = document.getElementById('f_vehicleSource').value;
  const externalVendor = vehicleSource === 'external' ? document.getElementById('f_externalVendor').value.trim() : '';
  const vendorCost = vehicleSource === 'external' ? document.getElementById('f_vendorCost').value : '';
  const amount = document.getElementById('f_amount').value;
  const paymentStatus = document.getElementById('f_paymentStatus').value;
  const taxType = document.getElementById('f_taxType').value;
  const note = document.getElementById('f_note').value.trim();
  const saveClient = document.getElementById('f_saveClient').checked;

  const record = { id, clientName, clientTaxId, clientPhone, date, docketNo, amStart, amEnd, pmStart, pmEnd, location, duration, amount, workContent, tonnage, vehicleNo, driver, assistant, vehicleSource, externalVendor, vendorCost, paymentStatus, taxType, note };

  if(isNew){
    record.createdAt = Date.now();
    record.vendorSettled = false;
    record.vendorSettledAt = null;
    state.orders.push(record);
  } else {
    const idx = state.orders.findIndex(o=>o.id===id);
    const prev = state.orders[idx];
    record.createdAt = prev.createdAt;
    record.updatedAt = Date.now();
    record.vendorSettled = prev.vendorSettled || false;
    record.vendorSettledAt = prev.vendorSettledAt || null;
    record.deletedAt = prev.deletedAt || null;
    state.orders[idx] = record;
  }
  saveOrders();

  if(saveClient) upsertClientFromOrder(clientName, clientTaxId, '', clientPhone);

  if(openingPendingReportId){
    const confirmedId = openingPendingReportId;
    openingPendingReportId = null;
    state.pendingReports = (state.pendingReports||[]).filter(r=>r.id!==confirmedId);
    deletePendingReport(confirmedId);
  }

  closeModal();
  render();
  showToast(isNew ? '已新增訂單' : '已儲存變更');
}

function deleteOrder(id){
  const o = state.orders.find(x=>x.id===id);
  if(!o) return;
  showConfirmModal('確定要刪除「'+o.clientName+'」'+fmtDate(o.date)+'的這筆訂單嗎？刪除後可以到「設定」頁的垃圾桶復原。', function(){
    o.deletedAt = Date.now();
    saveOrders();
    render();
    showToast('已刪除訂單，可到垃圾桶復原');
  }, { danger:true, okLabel:'刪除' });
}

============================================================ */
function setEnvelopePageStyle(pageWidthCm, pageHeightCm){
  let styleEl = document.getElementById('envelopePageStyleTag');
  if(!styleEl){
    styleEl = document.createElement('style');
    styleEl.id = 'envelopePageStyleTag';
    document.head.appendChild(styleEl);
  }
  styleEl.textContent = '@page{ size: '+pageWidthCm+'cm '+pageHeightCm+'cm; margin:0; }';
}
function clearEnvelopePageStyle(){
  const styleEl = document.getElementById('envelopePageStyleTag');
  if(styleEl) styleEl.remove();
}

function buildEnvelopeHtml(clientName){
  const co = state.companyInfo || {};
  const client = findClientByName(clientName) || {};
  const es = state.envelopeSettings || { orientation:'horizontal', length:22.9, width:10.5 };
  const orientation = es.orientation === 'vertical' ? 'vertical' : 'horizontal';
  const lengthCm = Number(es.length) || 22.9;
  const widthCm = Number(es.width) || 10.5;
  const pageWidth = orientation === 'vertical' ? widthCm : lengthCm;
  const pageHeight = orientation === 'vertical' ? lengthCm : widthCm;

  setEnvelopePageStyle(pageWidth, pageHeight);

  let recipientStyle, senderStyle;
  if(orientation === 'vertical'){
    // 直式：收件人置中偏右，寄件人左下角
    recipientStyle = 'top:42%; left:52%; width:44%; transform:translateY(-50%); font-size:4.2mm;';
    senderStyle = 'bottom:6%; left:6%; width:60%; font-size:3mm;';
  } else {
    // 橫式：收件人置中偏右上，寄件人左上角
    recipientStyle = 'top:30%; left:52%; width:44%; font-size:4.2mm;';
    senderStyle = 'top:6%; left:6%; width:55%; font-size:3mm;';
  }

  const recipientAddress = client.address || '（尚未在客戶管理設定地址）';
  const senderLines = [co.name, co.address, co.phone].filter(Boolean);

  return '<div class="envelope-toolbar">'
    + '<button class="btn btn-primary btn-sm" onclick="window.print()">'+ICONS.print+'列印</button>'
    + '<button class="btn btn-secondary btn-sm" data-action="close-envelope-view">'+ICONS.close+'關閉</button>'
    + '</div>'
    + '<div class="envelope-canvas" style="width:'+pageWidth+'cm; height:'+pageHeight+'cm;">'
      + '<div class="envelope-recipient" style="'+recipientStyle+'">'
        + '<div>'+escapeHtml(recipientAddress)+'</div>'
        + '<div class="name" style="margin-top:6px; font-size:1.3em;">'+escapeHtml(clientName)+' 收</div>'
      + '</div>'
      + '<div class="envelope-sender" style="'+senderStyle+'">'
        + senderLines.map(l=>'<div>'+escapeHtml(l)+'</div>').join('')
      + '</div>'
    + '</div>';
}

function openEnvelopePrint(clientName){
  if(!clientName){ alert('請先選擇客戶'); return; }
  closeModal();
  const html = buildEnvelopeHtml(clientName);
  const view = document.getElementById('envelopeView');
  view.innerHTML = html;
  view.classList.add('open');
  view.scrollTop = 0;
}

function closeEnvelopeView(){
  const view = document.getElementById('envelopeView');
  view.classList.remove('open');
  view.innerHTML = '';
  clearEnvelopePageStyle();
}

function buildInvoiceHtml(clientName, month){
  const co = state.companyInfo || {};
  const client = findClientByName(clientName) || {};
  const invoiceNo = getInvoiceNumber(clientName, month);
  const orders = ordersInMonth(month)
    .filter(o => o.clientName.trim()===clientName.trim())
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''));

  let includedTotal = 0, addedBaseTotal = 0, exemptTotal = 0;
  orders.forEach(o=>{
    const amt = Number(o.amount||0);
    if(o.taxType==='added') addedBaseTotal += amt;
    else if(o.taxType==='exempt') exemptTotal += amt;
    else includedTotal += amt;
  });
  const taxAmount = Math.round(addedBaseTotal * TAX_RATE);
  const addedTotalWithTax = addedBaseTotal + taxAmount;
  const grandTotal = includedTotal + addedTotalWithTax + exemptTotal;

  const rows = orders.map(o=>(
    '<tr>'
    + '<td>'+escapeHtml(fmtDate(o.date))+'</td>'
    + '<td>'+escapeHtml(o.docketNo||'')+'</td>'
    + '<td>'+escapeHtml(o.workContent||'')+'</td>'
    + '<td>'+escapeHtml(o.location||'')+'</td>'
    + '<td class="num">'+escapeHtml(taxTypeLabel(o.taxType))+'</td>'
    + '<td class="num">'+fmtMoney(o.amount)+'</td>'
    + '</tr>'
  )).join('');

  return '<div class="invoice-toolbar">'
    + '<button class="btn btn-primary btn-sm" onclick="window.print()">'+ICONS.download+'列印／另存為 PDF</button>'
    + '<button class="btn btn-secondary btn-sm" data-action="close-invoice-view">'+ICONS.close+'關閉</button>'
    + '</div>'
    + '<div class="invoice-doc">'
    + '<h1>請 款 單</h1>'
    + '<div class="invoice-head-row">'
      + '<div class="box"><div><span class="lab">請款廠商：</span>'+escapeHtml(co.name||'（尚未設定公司資料）')+'</div>'
      + '<div><span class="lab">統一編號：</span>'+escapeHtml(co.taxId||'—')+'</div>'
      + '<div><span class="lab">地址：</span>'+escapeHtml(co.address||'—')+'</div>'
      + '<div><span class="lab">電話：</span>'+escapeHtml(co.phone||'—')+'</div></div>'
      + '<div class="box"><div><span class="lab">請款對象：</span>'+escapeHtml(clientName)+'</div>'
      + '<div><span class="lab">統一編號：</span>'+escapeHtml(client.taxId||'—')+'</div>'
      + '<div><span class="lab">地址：</span>'+escapeHtml(client.address||'—')+'</div>'
      + '<div><span class="lab">請款月份：</span>'+escapeHtml(monthLabel(month))+'</div>'
      + '<div><span class="lab">發票編號：</span>'+escapeHtml(invoiceNo||'—')+'</div></div>'
    + '</div>'
    + '<table><thead><tr><th>日期</th><th>簽單編號</th><th>工作內容</th><th>工作地點</th><th class="num">稅別</th><th class="num">金額</th></tr></thead>'
    + '<tbody>'+(rows || '<tr><td colspan="6" style="text-align:center; color:#9B9A97;">這個月份沒有這位客戶的訂單</td></tr>')+'</tbody></table>'
    + '<div class="invoice-totals">'
      + '<div><span>稅內含金額小計</span><span>'+fmtMoney(includedTotal)+'</span></div>'
      + '<div><span>稅外加金額小計（未稅）</span><span>'+fmtMoney(addedBaseTotal)+'</span></div>'
      + '<div><span>營業稅（5%）</span><span>'+fmtMoney(taxAmount)+'</span></div>'
      + '<div><span>免稅金額小計</span><span>'+fmtMoney(exemptTotal)+'</span></div>'
      + '<div class="grand"><span>應付總額</span><span>'+fmtMoney(grandTotal)+'</span></div>'
    + '</div>'
    + '</div>';
}

/* ============================================================
   BACKUP / CSV EXPORT
============================================================ */
function downloadFile(filename, content, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function exportBackup(){
  const payload = { version:9, exportedAt: new Date().toISOString(), orders: state.orders, clients: state.clients, pricingRules: state.pricingRules, specialPricing: state.specialPricing, vendorRates: state.vendorRates, expenses: state.expenses, companyInfo: state.companyInfo, crewList: state.crewList, vehicleList: state.vehicleList, invoiceNumbers: state.invoiceNumbers, envelopeSettings: state.envelopeSettings };
  downloadFile('吊車請款備份_'+todayStr()+'.json', JSON.stringify(payload, null, 2), 'application/json');
  showToast('已匯出備份檔案');
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = function(e){
    let data;
    try{ data = JSON.parse(e.target.result); }catch(err){ alert('檔案格式錯誤，無法解析 JSON。'); return; }
    if(!data || !Array.isArray(data.orders) || !Array.isArray(data.clients)){
      alert('這不是有效的備份檔案（缺少 orders 或 clients 資料）。');
      return;
    }
    showConfirmModal('匯入將會覆蓋目前瀏覽器中所有的訂單、客戶、單價設定與支出紀錄，確定要繼續嗎？', function(){
      state.orders = data.orders;
      state.clients = data.clients;
      if(Array.isArray(data.pricingRules)) state.pricingRules = data.pricingRules;
      if(Array.isArray(data.specialPricing)) state.specialPricing = data.specialPricing;
      if(Array.isArray(data.vendorRates)) state.vendorRates = data.vendorRates;
      if(Array.isArray(data.expenses)) state.expenses = data.expenses;
      if(data.companyInfo && typeof data.companyInfo === 'object') state.companyInfo = data.companyInfo;
      if(Array.isArray(data.crewList)) state.crewList = data.crewList;
      if(Array.isArray(data.vehicleList)) state.vehicleList = data.vehicleList;
      if(data.invoiceNumbers && typeof data.invoiceNumbers === 'object') state.invoiceNumbers = data.invoiceNumbers;
      if(data.envelopeSettings && typeof data.envelopeSettings === 'object') state.envelopeSettings = data.envelopeSettings;
      saveOrders(); saveClients(); savePricing(); saveSpecialPricing(); saveVendorRates(); saveExpenses(); saveCompanyInfo(); saveCrewList(); saveVehicleList(); saveInvoiceNumbers(); saveEnvelopeSettings();
      render();
      showToast('匯入完成，共 '+state.orders.length+' 筆訂單、'+state.clients.length+' 家客戶');
    }, { danger:true, okLabel:'匯入並覆蓋' });
  };
  reader.readAsText(file);
}

function exportStatsCsv(){
  const m = state.statsMonth;
  const groupBy_dim = state.statsGroupBy === 'location' ? 'location' : 'client';
  const list = ordersInMonth(m);
  const expenses = expensesInMonth(m);

  function groupBy(keyFn){
    const map = {};
    list.forEach(o=>{
      const k = keyFn(o);
      if(!map[k]) map[k] = { label:k, count:0, hours:0, amount:0 };
      map[k].count++;
      map[k].hours += Number(o.duration||0);
      map[k].amount += Number(o.amount||0);
    });
    return Object.values(map).sort((a,b)=>b.amount-a.amount);
  }
  function buildVehicleRows(){
    const map = {};
    list.forEach(o=>{
      const k = o.vehicleNo ? o.vehicleNo.trim() : '未填寫車號';
      if(!map[k]) map[k] = { label:k, count:0, hours:0, income:0, expense:0 };
      map[k].count++;
      map[k].hours += Number(o.duration||0);
      map[k].income += Number(o.amount||0);
    });
    expenses.forEach(x=>{
      const k = x.licensePlate ? x.licensePlate.trim() : '未填寫車牌';
      if(!map[k]) map[k] = { label:k, count:0, hours:0, income:0, expense:0 };
      map[k].expense += Number(x.amount||0);
    });
    return Object.values(map).map(r=>Object.assign({}, r, { net: r.income - r.expense })).sort((a,b)=>b.net-a.net);
  }

  function receivableKey(o){
    if(groupBy_dim === 'location') return o.location ? o.location.trim() : '未填寫工地';
    return o.clientName.trim() || '未填寫客戶';
  }
  const customerRows = groupBy(o => (!isPeerClient(o.clientName)) ? receivableKey(o) : null).filter(r=>r.label);
  const peerReceivableRows = groupBy(o => isPeerClient(o.clientName) ? receivableKey(o) : null).filter(r=>r.label);
  function buildPeerPayableRows(){
    const map = {};
    list.forEach(o=>{
      if(o.vehicleSource !== 'external' || !o.vendorCost || Number(o.vendorCost)<=0) return;
      const k = o.externalVendor ? o.externalVendor.trim() : '未填寫外調對象';
      if(!map[k]) map[k] = { label:k, count:0, hours:0, amount:0 };
      map[k].count++;
      map[k].hours += Number(o.duration||0);
      map[k].amount += Number(o.vendorCost||0);
    });
    return Object.values(map).sort((a,b)=>b.amount-a.amount);
  }
  const peerPayableRows = buildPeerPayableRows();
  const vehicleRows = buildVehicleRows();
  const driverRows = groupBy(o => o.driver ? o.driver.trim() : '未填寫司機');

  function section(title, colLabel, rows){
    let s = '\n'+title+'\n'+colLabel+',筆數,總時長(小時),總金額\n';
    rows.forEach(r=>{ s += [r.label, r.count, r.hours, r.amount].join(',') + '\n'; });
    return s;
  }

  const dimLabel = groupBy_dim==='location' ? '工地' : '客戶名稱';
  const customerTotal = customerRows.reduce((s,r)=>s+r.amount,0);
  let csv = section('客戶應收明細（客戶要給我們）',dimLabel,customerRows).trim() + '\n合計,,,'+customerTotal+'\n';
  csv += section('同行應收明細（同行要給我們）',dimLabel,peerReceivableRows);
  csv += section('同行應付明細（我們要給同行）','同行名稱',peerPayableRows);

  csv += '\n各車輛營業額（收入-支出=淨營業額）\n車牌,筆數,總時長(小時),收入,支出,淨營業額\n';
  vehicleRows.forEach(r=>{ csv += [r.label, r.count, r.hours, r.income, r.expense, r.net].join(',') + '\n'; });

  csv += section('各司機總營業額','司機',driverRows);

  downloadFile('月結統計_'+m+'.csv', '\uFEFF'+csv, 'text/csv;charset=utf-8;');
  showToast('已匯出 CSV');
}

function resetAll(){
  showConfirmModal('確定要清空所有資料嗎？此動作無法復原，建議先匯出備份。', function(){
    showConfirmModal('再次確認：這會刪除全部訂單、客戶與支出資料，真的要繼續嗎？', function(){
      state.orders = [];
      state.clients = [];
      state.expenses = [];
      saveOrders(); saveClients(); saveExpenses();
      render();
      showToast('已清空所有資料');
    }, { danger:true, okLabel:'確定清空' });
  }, { danger:true, okLabel:'繼續' });
}

/* ============================================================
   EVENT DELEGATION
============================================================ */
document.addEventListener('click', function(e){
  const navEl = e.target.closest('[data-nav]');
  if(navEl){ navigate(navEl.getAttribute('data-nav')); return; }

  const actionEl = e.target.closest('[data-action]');
  if(!actionEl) return;
  const action = actionEl.getAttribute('data-action');
  const id = actionEl.getAttribute('data-id');

  if(action === 'open-order-modal') openOrderModal(id||null);
  else if(action === 'confirm-pending-report'){
    const report = (state.pendingReports||[]).find(r=>r.id===id);
    if(report) openOrderModal(null, report);
  }
  else if(action === 'save-order') saveOrderFromModal();
  else if(action === 'delete-order') deleteOrder(id);
  else if(action === 'open-driver-report-modal') openDriverReportModal(id);
  else if(action === 'save-driver-report') saveDriverReportFromModal();
  else if(action === 'open-client-modal') openClientModal(id||null);
  else if(action === 'save-client') saveClientFromModal();
  else if(action === 'delete-client') deleteClient(id);
  else if(action === 'open-pricing-modal') openPricingModal(id||null);
  else if(action === 'save-pricing') savePricingRuleFromModal();
  else if(action === 'delete-pricing') deletePricingRule(id);
  else if(action === 'open-special-pricing-modal') openSpecialPricingModal(id||null);
  else if(action === 'save-special-pricing') saveSpecialPricingFromModal();
  else if(action === 'delete-special-pricing') deleteSpecialPricingRule(id);
  else if(action === 'open-vendor-rate-modal') openVendorRateModal(id||null);
  else if(action === 'save-vendor-rate') saveVendorRateFromModal();
  else if(action === 'delete-vendor-rate') deleteVendorRate(id);
  else if(action === 'save-company-info') saveCompanyInfoFromPage();
  else if(action === 'save-envelope-settings') saveEnvelopeSettingsFromPage();
  else if(action === 'print-envelope'){
    const name = actionEl.getAttribute('data-name');
    openEnvelopePrint(name);
  }
  else if(action === 'print-envelope-from-invoice-modal'){
    const name = document.getElementById('inv_clientName').value;
    openEnvelopePrint(name);
  }
  else if(action === 'close-envelope-view') closeEnvelopeView();
  else if(action === 'add-crew-name') addCrewName();
  else if(action === 'delete-crew-name') deleteCrewName(actionEl.getAttribute('data-name'));
  else if(action === 'add-vehicle-plate') addVehiclePlate();
  else if(action === 'delete-vehicle-plate') deleteVehiclePlate(actionEl.getAttribute('data-name'));
  else if(action === 'open-expense-modal') openExpenseModal(id||null);
  else if(action === 'save-expense') saveExpenseFromModal();
  else if(action === 'delete-expense') deleteExpense(id);
  else if(action === 'select-crew'){
    state.scheduleFilters.name = actionEl.getAttribute('data-name');
    render();
  }
  else if(action === 'filter-client-type'){
    state.clientFilters.type = actionEl.getAttribute('data-type');
    render();
  }
  else if(action === 'set-stats-groupby'){
    state.statsGroupBy = actionEl.getAttribute('data-value');
    render();
  }
  else if(action === 'toggle-vendor-settled'){
    const o = state.orders.find(x=>x.id===id);
    if(o){
      o.vendorSettled = !o.vendorSettled;
      o.vendorSettledAt = o.vendorSettled ? todayStr() : null;
      saveOrders();
      render();
      showToast(o.vendorSettled ? '已標記為已付款' : '已改回未付款');
    }
  }
  else if(action === 'copy-job-text'){
    const o = state.orders.find(x=>x.id===id);
    if(o) copyTextToClipboard(buildJobShareText(o), ()=>showToast('已複製工作內容，可貼到 LINE 傳給司機'));
  }
  else if(action === 'close-modal') closeModal();
  else if(action === 'confirm-modal-ok'){
    const cb = pendingConfirmCallback;
    pendingConfirmCallback = null;
    document.getElementById('modalRoot').innerHTML = '';
    if(cb) cb();
  }
  else if(action === 'cancel-confirm-modal') closeModal();
  else if(action === 'export-backup') exportBackup();
  else if(action === 'import-backup') document.getElementById('importFileInput').click();
  else if(action === 'reset-all') resetAll();
  else if(action === 'export-stats-csv') exportStatsCsv();
  else if(action === 'set-trash-type'){
    state.trashFilters.type = actionEl.getAttribute('data-value');
    render();
  }
  else if(action === 'restore-order') restoreOrder(id);
  else if(action === 'purge-order') purgeOrder(id);
  else if(action === 'restore-client') restoreClient(id);
  else if(action === 'purge-client') purgeClient(id);
  else if(action === 'open-invoice-modal') openInvoiceModal();
  else if(action === 'generate-invoice') generateInvoiceFromModal();
  else if(action === 'close-invoice-view') closeInvoiceView();
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    const overlay = document.querySelector('.modal-overlay.open');

    if(e.target.id === 'crewNameInput'){ e.preventDefault(); addCrewName(); }
    else if(e.target.id === 'vehiclePlateInput'){ e.preventDefault(); addVehiclePlate(); }
  }
});
